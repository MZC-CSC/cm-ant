# ------------------------------------------------------------
# Blocks Korean text from entering the source code.
#
# Screen wording and code comments in this repository are written in English.
# A literal Korean string is shown as is regardless of the language setting,
# and new Korean comments are not accepted when the change is contributed to
# the community repository.
#
# The check looks only at lines a pull request ADDS. Pre-existing occurrences
# are left alone on purpose: this gate is here to stop new ones, not to force a
# repository-wide rewrite. It runs on every push to the pull request, not only
# when the pull request is opened.
#
# Paths where Korean is expected (e2e scenarios, Korean locale files, docs,
# test data) are excluded. EXCLUDE_RE is a copy of the canonical list; change
# both together.
#
# Canonical source: https://github.com/MZC-CSC/cmig-workflow/blob/main/conf/workflow-templates/korean-guard.yml
# Exclusion list:   https://github.com/MZC-CSC/cmig-workflow/blob/main/conf/korean-guard-exclude.regex
# Local path in target repo: .github/workflows/korean-guard.yml
# ------------------------------------------------------------

name: Korean Text Guard

on:
  pull_request:
    branches: [main, develop, master]

permissions:
  contents: read

jobs:
  block-korean-text:
    name: Block Korean text in added source lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA pin; updated by Dependabot)
        with:
          fetch-depth: 0

      - name: Scan added lines for Korean text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          # Copy of conf/korean-guard-exclude.regex in the workflow repository.
          EXCLUDE_RE='tests?/e2e/|\.feature$|/i18n/|/locales?/|(^|/)ko\.json$|/testdata/|_test\.go$|\.md$|^\.github/|^conf/docker/conf/'

          FOUND=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            printf '%s\n' "$file" | grep -qE "$EXCLUDE_RE" && continue

            # Added lines only, numbered within the added block.
            hit="$(git diff -U0 "$BASE_SHA...$HEAD_SHA" -- "$file" 2>/dev/null \
                   | sed -n 's/^+\([^+].*\)$/\1/p' \
                   | grep -nP '[\x{AC00}-\x{D7A3}]' | head -5)"
            [ -z "$hit" ] && continue
            FOUND="$FOUND"$'\n'"### $file"$'\n'"$(printf '%s\n' "$hit" | sed 's/^/    /')"
          done < <(git diff --name-only --diff-filter=d "$BASE_SHA...$HEAD_SHA" 2>/dev/null)

          if [ -n "$FOUND" ]; then
            echo "::error::Korean text found in added source lines. Screen wording and code comments must be in English."
            echo "$FOUND"
            exit 1
          fi

          echo "OK: no Korean text in added source lines."
